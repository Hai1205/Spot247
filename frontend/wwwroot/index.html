<!DOCTYPE html>
<html lang="vi">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spot247 - Authentication</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
